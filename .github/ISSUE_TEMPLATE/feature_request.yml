name: Feature request
description: An idea for desk.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The work desk gets in the way of, or doesn't help with yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Sketches are welcome.
  - type: textarea
    id: else
    attributes:
      label: What you do today instead
